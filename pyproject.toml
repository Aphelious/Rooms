[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rooms_game"
version = "0.1.0"
description = "A text-based adventure/escape-room game."
requires-python = ">=3.9"

[project.scripts]
rooms-game = "rooms_game.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
